name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "Berry-IT-Video-Downloader" --collect-all yt_dlp --collect-all imageio_ffmpeg --collect-all PIL app.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Berry-IT-Video-Downloader-Windows
          path: dist/Berry-IT-Video-Downloader.exe
      - name: Publish GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME dist/Berry-IT-Video-Downloader.exe --generate-notes
